name: Laurentia security regression
on:
  push:
    branches:
      - "claude/security-hardening-phase1-20261013"
  pull_request:
    paths:
      - "backend/services/frekcore_bridge.py"
      - "backend/services/kiltikonet_bridge.py"
      - "backend/routes/auth.py"
      - "backend/routes/laurentia_gateway.py"
      - "backend/services/cvl_brain.py"
      - "backend/tests/**"
      - ".github/workflows/security-regression.yml"
permissions:
  contents: read
jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated regression test dependencies
        run: python -m pip install --disable-pip-version-check "pytest==9.0.3" "httpx==0.28.1" "fastapi==0.110.1" "pydantic==2.13.4" "motor==3.3.1" "cryptography==48.0.0" "python-dotenv==1.2.2"
      - name: Run available security regression suites
        shell: bash
        run: |
          set -euo pipefail
          suites=()
          for path in \
            backend/tests/test_frekcore_bridge_production.py \
            backend/tests/test_kiltikonet_bridge_production.py \
            backend/tests/test_laurentia_gateway_tenant_auth.py \
            backend/tests/test_cvl_brain_sovereign.py \
            backend/tests/test_auth_frek_login_guard.py; do
            if [[ -f "$path" ]]; then suites+=("$path"); fi
          done
          if [[ ${#suites[@]} -eq 0 ]]; then
            echo "No security regression suites found" >&2
            exit 1
          fi
          python -m pytest -q "${suites[@]}"
