name: Laurentia security regression
on:
  pull_request:
    paths:
      - "backend/services/frekcore_bridge.py"
      - "backend/services/kiltikonet_bridge.py"
      - "backend/routes/auth.py"
      - "backend/routes/laurentia_gateway.py"
      - "backend/services/cvl_brain.py"
      - "backend/tests/**"
      - ".github/workflows/security-regression.yml"
  push:
    branches:
      - "claude/security-hardening-phase1-20261013"
      - "claude/security-tenant-isolation-phase2-20261013"
      - "claude/sovereign-llm-only-phase3-20261013"
      - "claude/frek-id-possession-phase4-20261013"
permissions:
  contents: read
jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated regression test dependencies
        run: python -m pip install --disable-pip-version-check "pytest==9.0.3" "httpx==0.28.1" "fastapi==0.110.1" "pydantic==2.13.4" "motor==3.3.1" "cryptography==48.0.0"
      - name: Run available security regression suites
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t suites < <(find backend/tests -maxdepth 1 -type f \\( \\
            -name 'test_frekcore_bridge_production.py' -o \\
            -name 'test_kiltikonet_bridge_production.py' -o \\
            -name 'test_laurentia_gateway_tenant_auth.py' -o \\
            -name 'test_cvl_brain_sovereign.py' -o \\
            -name 'test_auth_frek_login_guard.py' \\
          \\) -print | sort)
          if [ "${#suites[@]}" -eq 0 ]; then
            echo "No security regression suites found" >&2
            exit 1
          fi
          python -m pytest -q "${suites[@]}"
