name: Backend contract smoke

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-contract-smoke.yml"

permissions:
  contents: read

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backend Python sources
        run: python -m compileall -q backend
      - name: Install minimal auth contract test dependencies
        run: python -m pip install --disable-pip-version-check "pytest==9.0.3" "fastapi==0.110.1" "httpx==0.28.1" "pydantic==2.13.4" "openai==1.99.9" "motor==3.7.1" "python-dotenv==1.2.2"
      - name: Run static contract regression tests when present
        run: |
          if [ -d backend/contract_tests ]; then
            python -m pytest -q backend/contract_tests
          else
            echo "No static contract tests found; syntax check only."
          fi
