name: Embedded inference contract

on:
  pull_request:
    branches: [public]
    paths:
      - "backend/**"
      - ".github/workflows/embedded-inference.yml"
  push:
    branches: [feat/embedded-local-inference]
    paths:
      - "backend/**"
      - ".github/workflows/embedded-inference.yml"

permissions:
  contents: read

jobs:
  embedded-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies including native CPU runtime
        run: python -m pip install -r backend/requirements.txt
      - name: Run embedded inference contract tests
        working-directory: backend
        run: python -m pytest -q contract_tests/test_embedded_inference_contract.py contract_tests/test_root_health_contract.py
