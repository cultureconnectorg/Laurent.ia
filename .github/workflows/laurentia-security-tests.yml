name: Laurentia security regression tests

on:
  pull_request:
    paths:
      - "backend/services/cvl_brain.py"
      - "backend/services/frekcore_bridge.py"
      - "backend/services/kiltikonet_bridge.py"
      - "backend/routes/auth.py"
      - "backend/tests/**"
      - ".github/workflows/laurentia-security-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal public test dependencies
        run: python -m pip install --upgrade pip pytest httpx fastapi pydantic python-dotenv
      - name: Run sovereign LLM and identity bridge regressions
        env:
          LAURENTIA_ENV: test
        run: >-
          python -m pytest -q
          backend/tests/test_cvl_brain_sovereign.py
          backend/tests/test_auth_frek_login_guard.py
          backend/tests/test_frekcore_bridge_production.py
          backend/tests/test_kiltikonet_bridge_production.py
