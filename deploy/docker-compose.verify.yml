# Verification only (CI or a machine without model weights): replaces the real engine
# by the deterministic local test engine. Never used for real work.
services:
  test-engine:
    image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    command: ["python", "/h/fake_engine.py", "--port", "8090", "--host", "0.0.0.0"]
    volumes:
      - ../backend/tests/_harness:/h:ro
    networks: [core]
  backend:
    environment:
      BRAIN_ENGINE_URL: http://test-engine:8090
      LAURENTIA_ALLOWED_MODEL_HOSTS: test-engine
      BRAIN_ENGINE_MODEL: fake-deterministic
      LAURENTIA_IDENTITY_STATUS_TTL: "2"   # revocation check without waiting a minute
      LAURENTIA_ENROLLMENT_LOCK_TTL: "3"   # abandoned-ceremony expiry without waiting 5 minutes
  proxy:
    # Plain-HTTP localhost for the browser checks: localhost is a secure context for
    # WebAuthn, while a throwaway browser does not trust the local CA.
    ports:
      - "127.0.0.1:8080:80"
